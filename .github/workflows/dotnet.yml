name: Build and Test

  on:
    push:
      branches: [ master, main ]
    pull_request:
      branches: [ master, main ]

  jobs:
    build:
      name: Build CyberBot (.NET 8)
      runs-on: windows-latest

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Setup .NET 8
          uses: actions/setup-dotnet@v4
          with:
            dotnet-version: 8.0.x

        - name: Restore dependencies
          run: dotnet restore CyberBot.csproj

        - name: Build project
          run: dotnet build CyberBot.csproj --no-restore --configuration Release

        - name: Build success
          run: echo "Build completed successfully!"
  