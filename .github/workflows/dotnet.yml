name: Build - CyberBot All Parts

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-part1:
    name: Build Part 1 - Console App
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore dependencies
        run: dotnet restore CyberBot.csproj
      - name: Build (Release)
        run: dotnet build CyberBot.csproj --no-restore --configuration Release

  build-part2:
    name: Build Part 2 - WPF GUI
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore dependencies
        run: dotnet restore Part2/CybersecurityChatbot.csproj
      - name: Build (Release)
        run: dotnet build Part2/CybersecurityChatbot.csproj --no-restore --configuration Release

  build-part3:
    name: Build Part 3 - WPF GUI (Task Assistant, Quiz, NLP, Activity Log)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore dependencies (includes MySql.Data NuGet package)
        run: dotnet restore Part3/CybersecurityChatbotPart3.csproj
      - name: Build (Release)
        run: dotnet build Part3/CybersecurityChatbotPart3.csproj --no-restore --configuration Release
